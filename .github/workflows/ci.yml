name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show package version
        run: python -c "import proximitygraphs as pg; print(pg.__version__)"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run core tests
        run: python -m pytest -q -m "not gis"

  warnings:
    name: Warning report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      # Warning policy:
      # - proximitygraphs DeprecationWarning/FutureWarning fail via pyproject.toml.
      # - third-party warnings remain visible in logs for maintenance triage.
      - name: Run tests with warnings visible
        run: python -m pytest -q -m "not gis" -W default

  gis:
    name: GIS tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with GIS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gis]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run GIS tests
        run: python -m pytest -q -m gis

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, warnings, gis]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check installed dependencies
        run: python -m pip check

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m pip install dist/*.whl
          python scripts/smoke_test_install.py
          python -m pip check

  gis-matrix:
    name: GIS matrix Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with GIS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gis]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run GIS tests
        run: python -m pytest -q -m gis
