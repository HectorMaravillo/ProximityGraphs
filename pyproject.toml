[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proximitygraphs"
dynamic = ["version"]
description = "Python tools for constructing, comparing, and experimenting with proximity graphs on planar point sets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Hector Maravillo" },
  { name = "Diego Villarreal" },
  { name = "Heriberto Espino Montelongo" },
]

dependencies = [
  "igraph>=0.11",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

keywords = [
  "proximity graphs",
  "computational geometry",
  "beta skeleton",
  "gamma neighborhood",
  "alpha shapes",
  "stepping stone",
  "nng",
  "eliptic gabriel graph",
  "physarum graph",
  "fungal graph"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/HectorMaravillo/ProximityGraphs"
Repository = "https://github.com/HectorMaravillo/ProximityGraphs"
Issues = "https://github.com/HectorMaravillo/ProximityGraphs/issues"
Documentation = "https://hectormaravillo.github.io/ProximityGraphs/"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

docs = [
  "myst-parser>=4",
  "Sphinx>=8",
  "sphinx-autodoc-typehints>=3",
  "sphinx-book-theme>=1.1",
  "sphinxcontrib-bibtex>=2.6",
]

gis = [
  "geopandas>=1.0",
  "shapely>=2.0",
]

[tool.setuptools.dynamic]
version = { attr = "proximitygraphs.__version__" }

[tool.setuptools.packages.find]
include = ["proximitygraphs*"]

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
  "gis: tests requiring optional GIS dependencies",
]
filterwarnings = [
  "error::DeprecationWarning:proximitygraphs.*",
  "error::FutureWarning:proximitygraphs.*",
  "default::DeprecationWarning",
  "default::FutureWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  "article",
  "docs/build",
  "docs/scripts/generate_all_doc_images.py",
  "*.ipynb",
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "RUF",
  "PT",
  "NPY",
]
